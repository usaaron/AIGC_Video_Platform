[project]
name = "ai-comic-content-os"
version = "0.1.0"
description = "Data-driven content operating system for AI comic production."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "sqlmodel>=0.0.22,<0.1",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"app.modules.script_engine" = ["static_knowledge_catalog.v1.json"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
