name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @seqora/e2e exec playwright install --with-deps chromium

      - name: Enforce append-only migrations
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            exit 0
          fi

          invalid="$(git diff --name-status "${BASE_SHA}" "${HEAD_SHA}" -- apps/api/src/infra/migrations | awk '$1 != "A" { print }')"
          if [[ -n "${invalid}" ]]; then
            echo "Migration files are append-only. Add a new version instead of modifying or deleting existing files:"
            echo "${invalid}"
            exit 1
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint source
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Reject deprecated organization API usage
        run: pnpm check:organization-api

      - name: Verify deployment security controls
        run: pnpm check:deployment-security

      - name: Run API unit coverage gate
        run: pnpm test:backend:coverage

      - name: Run full workspace test suite
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Create release plan
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          api=false
          web=false

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            api=true
            web=true
          else
            while IFS= read -r path; do
              case "$path" in
                packages/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|.dockerignore|compose.demo.yml|deploy/update-release.sh|.github/workflows/deploy.yml)
                  api=true
                  web=true
                  ;;
                apps/api/*|deploy/api.Dockerfile)
                  api=true
                  ;;
                apps/web/*|apps/admin/*|deploy/web.Dockerfile|deploy/Caddyfile)
                  web=true
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          fi

          mkdir -p .release
          printf 'api=%s\nweb=%s\nsha=%s\n' "$api" "$web" "$GITHUB_SHA" > .release/release-plan.env

      - name: Upload release plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: .release/release-plan.env
          retention-days: 1
          if-no-files-found: error

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seqora_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seqora_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seqora_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:shared

      - name: Apply Postgres migrations
        run: pnpm --filter @seqora/api db:migrate

      - name: Run API contract tests
        run: pnpm --filter @seqora/api test:api-contract

      - name: Run migration, auth, admin, billing, project, and queue integration tests
        run: pnpm --filter @seqora/api test:integration

      - name: Run backend security tests
        run: pnpm --filter @seqora/api test:security
