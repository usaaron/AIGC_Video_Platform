name: Bug 报告
description: 报告可复现的功能或界面问题
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Chrome 126 / main@commit
  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志
